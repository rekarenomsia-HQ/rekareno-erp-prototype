<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rekareno 商业模式 mindmap</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --orange: #f97316;
    --orange2: #ea580c;
    --orange-soft: #fed7aa;
    --blue: #bfdbfe;
    --indigo: #c7d2fe;
    --teal: #99f6e4;
    --amber: #fde68a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 1100px; margin: 28px auto; padding: 0 18px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  svg { width: 100%; height: auto; display: block; background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; }
  .wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .t { font-weight: 700; }
  .h { font-weight: 650; }
  .s { font-size: 12px; fill: #5b6475; }
  @media (max-width: 700px) { svg { min-width: 900px; } }
</style>
